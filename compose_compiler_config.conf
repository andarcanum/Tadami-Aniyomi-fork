// Compose compiler stability configuration.
// Declares immutable JDK, resource, and pure-val :domain model types as stable so
// Composables in :app and :presentation-* can skip recomposition instead of treating
// cross-module types (from modules without the Compose compiler plugin) as unstable.
//
// IMPORTANT: Never add classes containing mutable `var` properties or mutable collections
// (e.g., UserProfile, Pin, SManga, SAnime).

// JDK immutable value types
java.time.*
java.util.Locale
java.util.UUID

// Moko Resources immutable descriptors
dev.icerock.moko.resources.StringResource
dev.icerock.moko.resources.PluralsResource
dev.icerock.moko.resources.AssetResource
dev.icerock.moko.resources.FileResource
dev.icerock.moko.resources.ColorResource
dev.icerock.moko.resources.ImageResource

